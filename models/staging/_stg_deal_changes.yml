
version: 2

models:
  - name: stg_deal_changes
    description: "Deduplicated Pipedrive deal change history"

    columns:
      - name: deal_id
        description: "Deal associated with the change"
        data_tests:
          - not_null

      - name: changed_at
        description: "Timestamp of the change"
        data_tests:
          - not_null

      - name: field_name
        description: "Field that was changed"
        data_tests:
          - not_null

      - name: field_value
        description: "New value after the change"